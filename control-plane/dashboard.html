<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>URAI Control Plane</title>
  <style>
    body { font-family: Arial; margin: 0; background: #0b0f19; color: #e6e6e6; }
    header { padding: 16px; border-bottom: 1px solid #1f2937; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 16px; }
    .card { background: #111827; padding: 12px; border-radius: 10px; }
    .title { font-size: 18px; font-weight: bold; }
    .status { color: #9ca3af; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <div class="title">URAI Control Plane — LIVE OS</div>
    <div class="status" id="status">Loading...</div>
  </header>

  <div id="summary" class="card"></div>
  <div id="grid" class="grid"></div>

  <script>
    async function load() {
      const res = await fetch('/control-plane/status');
      const data = await res.json();

      document.getElementById('status').innerText =
        'Updated: ' + new Date(data.timestamp).toLocaleTimeString();

      const h = data.health.summary;

      document.getElementById('summary').innerHTML = `
        <b>System Summary</b><br/>
        Services: ${data.serviceCount}<br/>
        Healthy: ${h.healthy}<br/>
        Degraded: ${h.degraded}<br/>
        Offline: ${h.offline}<br/>
      `;

      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      data.health.services.forEach(s => {
        const el = document.createElement('div');
        el.className = 'card';
        el.innerHTML = `
          <b>${s.name}</b><br/>
          Type: ${s.type}<br/>
          Status: ${s.status}
        `;
        grid.appendChild(el);
      });
    }

    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
