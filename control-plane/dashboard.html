<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>URAI Control Plane</title>
  <style>
    body { font-family: Arial; margin: 0; background: #0b0f19; color: #e6e6e6; }
    header { padding: 16px; border-bottom: 1px solid #1f2937; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 16px; }
    .card { background: #111827; padding: 12px; border-radius: 10px; }
    .title { font-size: 18px; font-weight: bold; }
    .status { color: #9ca3af; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <div class="title">URAI Control Plane — Live System</div>
    <div class="status">Loading registry...</div>
  </header>

  <div id="grid" class="grid"></div>

  <script>
    async function load() {
      const res = await fetch('/control-plane/registry');
      const data = await res.json();

      document.querySelector('.status').innerText = 
        'Services: ' + data.services.length;

      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      data.services.forEach(s => {
        const el = document.createElement('div');
        el.className = 'card';
        el.innerHTML = `
          <div><b>${s.name}</b></div>
          <div>Type: ${s.type}</div>
          <div>Status: ${s.status}</div>
        `;
        grid.appendChild(el);
      });
    }

    load();
  </script>
</body>
</html>
