name: Admin Next maintenance patch generator

on:
  pull_request:
    paths:
      - .github/workflows/admin-next-maintenance-patch.yml

permissions:
  contents: read

concurrency:
  group: admin-next-maintenance-patch-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact generator source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact clean input
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Setup declared pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.15.0
          run_install: false
      - name: Setup declared Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Generate bounded maintenance patch
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          for (const app of ['urai-admin', 'urai-analytics']) {
            const path = `apps/${app}/package.json`;
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (pkg.dependencies.next !== '15.5.26' || pkg.devDependencies['eslint-config-next'] !== '15.5.26') throw new Error(`Unexpected maintenance input: ${path}`);
            pkg.dependencies.next = '15.5.27';
            pkg.devDependencies['eslint-config-next'] = '15.5.27';
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          }
          const functionsPath = 'functions/package.json';
          const functionsPkg = JSON.parse(fs.readFileSync(functionsPath, 'utf8'));
          if (functionsPkg.dependencies.next !== '15.5.26') throw new Error('Unexpected Functions maintenance input');
          functionsPkg.dependencies.next = '15.5.27';
          fs.writeFileSync(functionsPath, JSON.stringify(functionsPkg, null, 2) + '\n');
          NODE
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
          mkdir -p /tmp/urai-admin-next-patch
          cp --parents apps/urai-admin/package.json apps/urai-analytics/package.json functions/package.json pnpm-lock.yaml /tmp/urai-admin-next-patch
          sha256sum apps/urai-admin/package.json apps/urai-analytics/package.json functions/package.json pnpm-lock.yaml > /tmp/urai-admin-next-patch/generated-sha256.txt
          printf 'input_head=%s\ninput_tree=%s\nnode=%s\npnpm=%s\ndeployment=false\npaid_execution=false\n' "$TARGET_SHA" "$(git rev-parse HEAD^{tree})" "$(node --version)" "$(pnpm --version)" > /tmp/urai-admin-next-patch/authority.env
      - name: Audit complete generated dependency graph
        shell: bash
        run: |
          set -euo pipefail
          pnpm audit --json > /tmp/urai-admin-next-patch/full-audit.json
      - name: Upload candidate patch and exact generator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: urai-admin-next-maintenance-patch-${{ env.TARGET_SHA }}
          path: /tmp/urai-admin-next-patch
          if-no-files-found: error
          retention-days: 90
