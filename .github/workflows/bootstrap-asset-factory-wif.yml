name: Bootstrap Asset Factory WIF

on:
  push:
    branches:
      - agent/bootstrap-asset-factory-wif
    paths:
      - .github/workflows/bootstrap-asset-factory-wif.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      PROJECT_ID: urai-4dc1d
      POOL_ID: urai-github
      PROVIDER_ID: asset-factory-github
      TARGET_REPOSITORY_ID: '1150887894'
      TARGET_OWNER_ID: '215797546'
      TARGET_SERVICE_ACCOUNT: asset-factory-deploy@urai-4dc1d.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require existing Admin WIF identity
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$WIF_PROVIDER" ]] || { echo 'production GCP_WIF_PROVIDER is missing' >&2; exit 1; }
          [[ -n "$WIF_SERVICE_ACCOUNT" ]] || { echo 'production GCP_DEPLOY_SERVICE_ACCOUNT is missing' >&2; exit 1; }

      - name: Authenticate through existing Admin WIF
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Bootstrap immutable Asset Factory trust
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project "$PROJECT_ID" >/dev/null
          PROJECT_NUMBER="$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
          [[ "$PROJECT_NUMBER" =~ ^[0-9]+$ ]] || { echo 'Could not resolve numeric project number.' >&2; exit 1; }

          if ! gcloud iam workload-identity-pools describe "$POOL_ID" --project="$PROJECT_ID" --location=global >/dev/null 2>&1; then
            gcloud iam workload-identity-pools create "$POOL_ID" --project="$PROJECT_ID" --location=global --display-name='URAI GitHub Actions'
          fi

          if ! gcloud iam workload-identity-pools providers describe "$PROVIDER_ID" --project="$PROJECT_ID" --location=global --workload-identity-pool="$POOL_ID" >/dev/null 2>&1; then
            gcloud iam workload-identity-pools providers create-oidc "$PROVIDER_ID" \
              --project="$PROJECT_ID" \
              --location=global \
              --workload-identity-pool="$POOL_ID" \
              --display-name='Asset Factory GitHub Actions' \
              --issuer-uri='https://token.actions.githubusercontent.com/' \
              --attribute-mapping='google.subject=assertion.sub,attribute.repository=assertion.repository,attribute.repository_id=assertion.repository_id,attribute.repository_owner=assertion.repository_owner,attribute.repository_owner_id=assertion.repository_owner_id' \
              --attribute-condition="assertion.repository_owner_id == '${TARGET_OWNER_ID}' && assertion.repository_id == '${TARGET_REPOSITORY_ID}'"
          fi

          gcloud iam workload-identity-pools providers describe "$PROVIDER_ID" \
            --project="$PROJECT_ID" \
            --location=global \
            --workload-identity-pool="$POOL_ID" \
            --format='yaml(name,state,attributeMapping,attributeCondition)'

          if ! gcloud iam service-accounts describe "$TARGET_SERVICE_ACCOUNT" --project="$PROJECT_ID" >/dev/null 2>&1; then
            gcloud iam service-accounts create asset-factory-deploy --project="$PROJECT_ID" --display-name='Asset Factory deploy verifier'
          fi

          gcloud iam service-accounts add-iam-policy-binding "$TARGET_SERVICE_ACCOUNT" \
            --project="$PROJECT_ID" \
            --role='roles/iam.workloadIdentityUser' \
            --member="principalSet://iam.googleapis.com/projects/${PROJECT_NUMBER}/locations/global/workloadIdentityPools/${POOL_ID}/attribute.repository_id/${TARGET_REPOSITORY_ID}"

          PROVIDER_RESOURCE="projects/${PROJECT_NUMBER}/locations/global/workloadIdentityPools/${POOL_ID}/providers/${PROVIDER_ID}"
          {
            echo '### Asset Factory WIF bootstrap'
            echo "- Project number: ${PROJECT_NUMBER}"
            echo "- Provider: ${PROVIDER_RESOURCE}"
            echo "- Service account: ${TARGET_SERVICE_ACCOUNT}"
            echo "- Repository ID: ${TARGET_REPOSITORY_ID}"
            echo '- Long-lived service-account key created: no'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify no service-account user-managed keys
        shell: bash
        run: |
          set -euo pipefail
          KEYS="$(gcloud iam service-accounts keys list --iam-account="$TARGET_SERVICE_ACCOUNT" --managed-by=user --format='value(name)')"
          if [[ -n "$KEYS" ]]; then
            echo 'User-managed service-account key exists; refusing to certify keyless lane.' >&2
            exit 1
          fi
          echo '- User-managed service-account keys: none' >> "$GITHUB_STEP_SUMMARY"
