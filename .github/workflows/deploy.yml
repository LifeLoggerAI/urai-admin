name: Deploy URAI Admin

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY URAI ADMIN to authorize a production deployment"
        required: true
        type: string
      target_sha:
        description: "Exact 40-character commit SHA approved for production"
        required: true
        type: string
      base_url:
        description: "Base URL to verify after deploy"
        required: false
        default: "https://urai-admin.web.app"
        type: string
      functions_base_url:
        description: "Functions base URL to verify after deploy"
        required: false
        default: "https://us-central1-urai-4dc1d.cloudfunctions.net"
        type: string

permissions:
  contents: read

concurrency:
  group: urai-admin-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy approved SHA to Firebase Hosting and Functions
    runs-on: ubuntu-latest
    environment: production
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      URAI_ADMIN_BASE_URL: ${{ inputs.base_url || vars.URAI_ADMIN_BASE_URL || 'https://urai-admin.web.app' }}
      URAI_ADMIN_FUNCTIONS_BASE_URL: ${{ inputs.functions_base_url || vars.URAI_ADMIN_FUNCTIONS_BASE_URL || 'https://us-central1-urai-4dc1d.cloudfunctions.net' }}
    steps:
      - name: Checkout approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate explicit deployment authorization
        env:
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
          APPROVED_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail

          if [[ "${DEPLOY_CONFIRMATION}" != "DEPLOY URAI ADMIN" ]]; then
            echo "Production deployment confirmation did not match the required phrase." >&2
            exit 1
          fi

          if [[ ! "${APPROVED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "target_sha must be a full 40-character lowercase commit SHA." >&2
            exit 1
          fi

          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_sha}" != "${APPROVED_SHA}" ]]; then
            echo "Checked-out SHA ${actual_sha} does not match approved SHA ${APPROVED_SHA}." >&2
            exit 1
          fi

          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "${actual_sha}" origin/main; then
            echo "Approved SHA must be reachable from origin/main." >&2
            exit 1
          fi

          echo "Authorized production deployment for ${actual_sha}."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run launch lock
        run: bash scripts/launch-lock.sh

      - name: Append workflow metadata to launch evidence
        if: always()
        env:
          APPROVED_SHA: ${{ inputs.target_sha }}
        run: |
          mkdir -p tmp
          {
            echo
            echo "## GitHub Actions metadata"
            echo "Workflow: ${GITHUB_WORKFLOW}"
            echo "Run ID: ${GITHUB_RUN_ID}"
            echo "Run number: ${GITHUB_RUN_NUMBER}"
            echo "Trigger: ${GITHUB_EVENT_NAME}"
            echo "Actor: ${GITHUB_ACTOR}"
            echo "Approved SHA: ${APPROVED_SHA}"
          } >> tmp/urai-admin-launch-evidence.md

      - name: Upload launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urai-admin-launch-evidence
          path: tmp/urai-admin-launch-evidence.md
          if-no-files-found: error
          retention-days: 30
