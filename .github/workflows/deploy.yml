name: Deploy URAI Admin

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to verify after deploy"
        required: false
        default: "https://urai-admin.web.app"
      functions_base_url:
        description: "Functions base URL to verify after deploy"
        required: false
        default: "https://us-central1-urai-4dc1d.cloudfunctions.net"
  push:
    branches:
      - main

concurrency:
  group: urai-admin-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Firebase Hosting and Functions
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      URAI_ADMIN_BASE_URL: ${{ inputs.base_url || vars.URAI_ADMIN_BASE_URL || 'https://urai-admin.web.app' }}
      URAI_ADMIN_FUNCTIONS_BASE_URL: ${{ inputs.functions_base_url || vars.URAI_ADMIN_FUNCTIONS_BASE_URL || 'https://us-central1-urai-4dc1d.cloudfunctions.net' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run launch lock
        run: bash scripts/launch-lock.sh

      - name: Append workflow metadata to launch evidence
        if: always()
        run: |
          mkdir -p tmp
          {
            echo
            echo "## GitHub Actions metadata"
            echo "Workflow: ${GITHUB_WORKFLOW}"
            echo "Run ID: ${GITHUB_RUN_ID}"
            echo "Run number: ${GITHUB_RUN_NUMBER}"
            echo "Trigger: ${GITHUB_EVENT_NAME}"
            echo "Actor: ${GITHUB_ACTOR}"
          } >> tmp/urai-admin-launch-evidence.md

      - name: Upload launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urai-admin-launch-evidence
          path: tmp/urai-admin-launch-evidence.md
          if-no-files-found: error
          retention-days: 30