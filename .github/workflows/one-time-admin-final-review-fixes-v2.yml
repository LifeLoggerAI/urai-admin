name: One-time Admin final review fixes v2

on:
  push:
    branches:
      - fix/system-registry-truth-rebased-20260711
    paths:
      - '.github/workflows/one-time-admin-final-review-fixes-v2.yml'

permissions:
  contents: write

concurrency:
  group: one-time-admin-final-review-fixes-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact Admin branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/system-registry-truth-rebased-20260711
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Apply exact final review repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          policy = Path('scripts/system-registry-cloud-policy.mjs')
          text = policy.read_text()
          anchor = 'function projectFromServiceAccountEmail(value) {'
          guard = dedent("""\
          function requirePrivateKeyServiceAccount(credential) {
            if (
              credential.type !== 'service_account'
              || typeof credential.client_email !== 'string'
              || !credential.client_email
              || typeof credential.private_key !== 'string'
              || !credential.private_key
            ) {
              fail('Cloud apply requires complete private-key service_account JSON with client_email and private_key.');
            }
          }

          """)
          if guard not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('policy: service-account anchor mismatch')
              text = text.replace(anchor, guard + anchor, 1)

          impersonation_fn = dedent("""\
          function projectFromImpersonationUrl(value) {
            if (typeof value !== 'string' || !value) return '';
            let decoded;
            try {
              decoded = decodeURIComponent(value);
            } catch {
              decoded = value;
            }
            const match = decoded.match(/serviceAccounts\/([^/:]+)(?::generateAccessToken)?$/);
            return projectFromServiceAccountEmail(match?.[1] || '');
          }

          """)
          if text.count(impersonation_fn) != 1:
              raise SystemExit('policy: impersonation function mismatch')
          text = text.replace(impersonation_fn, '', 1)

          old_identity = dedent("""\
            const emailProject = projectFromServiceAccountEmail(credential.client_email);
            if (emailProject) identityProjects.add(emailProject);
            const impersonationProject = projectFromImpersonationUrl(credential.service_account_impersonation_url);
            if (impersonationProject) identityProjects.add(impersonationProject);

            if (identityProjects.size === 0) {
              fail('Cloud credential does not expose a project-bound service account identity through client_email or service_account_impersonation_url.');
            }
          """)
          new_identity = dedent("""\
            const emailProject = projectFromServiceAccountEmail(credential.client_email);
            if (emailProject) identityProjects.add(emailProject);

            if (identityProjects.size === 0) {
              fail('Cloud credential does not expose a project-bound service account identity through client_email.');
            }
          """)
          if text.count(old_identity) != 1:
              raise SystemExit('policy: identity block mismatch')
          text = text.replace(old_identity, new_identity, 1)
          call_anchor = '  const boundProjectId = credentialProjectId(credential);'
          if text.count(call_anchor) != 1:
              raise SystemExit('policy: credential validation anchor mismatch')
          text = text.replace(call_anchor, '  requirePrivateKeyServiceAccount(credential);\n' + call_anchor, 1)
          policy.write_text(text)

          receipt_test = Path('scripts/test-system-registry-cloud-receipt.mjs')
          text = receipt_test.read_text()
          old_fixture = dedent("""\
          const credential = JSON.stringify({
            type: 'service_account',
            project_id: PROJECT,
            client_email: `registry-deployer@${PROJECT}.iam.gserviceaccount.com`,
          });
          """)
          new_fixture = dedent("""\
          const credential = JSON.stringify({
            type: 'service_account',
            project_id: PROJECT,
            client_email: `registry-deployer@${PROJECT}.iam.gserviceaccount.com`,
            private_key: '-----BEGIN PRIVATE KEY-----\\nTEST\\n-----END PRIVATE KEY-----\\n',
          });
          """)
          if text.count(old_fixture) != 1:
              raise SystemExit('cloud receipt primary fixture mismatch')
          text = text.replace(old_fixture, new_fixture, 1)
          conflict_old = dedent("""\
                    project_id: 'different-project',
                    client_email: `registry-deployer@${PROJECT}.iam.gserviceaccount.com`,
          """)
          conflict_new = dedent("""\
                    type: 'service_account',
                    project_id: 'different-project',
                    client_email: `registry-deployer@${PROJECT}.iam.gserviceaccount.com`,
                    private_key: '-----BEGIN PRIVATE KEY-----\\nTEST\\n-----END PRIVATE KEY-----\\n',
          """)
          if text.count(conflict_old) != 1:
              raise SystemExit('cloud receipt conflict fixture mismatch')
          text = text.replace(conflict_old, conflict_new, 1)
          text = text.replace('/does not expose a project-bound service account identity/', '/complete private-key service_account JSON/', 1)
          external_assert = dedent("""\
              assert.throws(
                () => validateRegistryCloudAuthority({
                  env: {
                    GOOGLE_APPLICATION_CREDENTIALS: '/tmp/external-account.json',
                    URAI_ADMIN_SEED_RECEIPT_PATH: 'docs/release-evidence/cloud/external-account.json',
                  },
                  projectId: PROJECT,
                  readFileSyncFn: () => JSON.stringify({
                    type: 'external_account',
                    service_account_impersonation_url: `https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/registry-deployer@${PROJECT}.iam.gserviceaccount.com:generateAccessToken`,
                  }),
                }),
                /complete private-key service_account JSON/,
              );
          """)
          insert_anchor = "    console.log('OK: cloud apply requires a service-account identity and treats project_id only as a consistency check');"
          if external_assert not in text:
              if text.count(insert_anchor) != 1:
                  raise SystemExit('cloud receipt external-account insertion mismatch')
              text = text.replace(insert_anchor, external_assert + insert_anchor, 1)
          receipt_test.write_text(text)

          guard_test = Path('scripts/test-system-registry-seed-guard.mjs')
          text = guard_test.read_text()
          old = "      client_email: `registry-deployer@${projectId}.iam.gserviceaccount.com`,\n    }),"
          new = "      client_email: `registry-deployer@${projectId}.iam.gserviceaccount.com`,\n      private_key: '-----BEGIN PRIVATE KEY-----\\nTEST\\n-----END PRIVATE KEY-----\\n',\n    }),"
          if text.count(old) != 1:
              raise SystemExit('seed guard credential fixture mismatch')
          guard_test.write_text(text.replace(old, new, 1))

          contract = Path('scripts/test-system-registry-contract.mjs')
          text = contract.read_text()
          package_anchor = "const packageJson = JSON.parse(readFileSync('package.json', 'utf8'));"
          functions_read = "const functionsAppPackageJson = JSON.parse(readFileSync('functions/apps/urai-admin/package.json', 'utf8'));"
          if functions_read not in text:
              text = text.replace(package_anchor, package_anchor + '\n' + functions_read, 1)
          text = text.replace(
              "  ['service_account_impersonation_url', 'cloud policy must bind workload identity impersonation'],",
              "  ['complete private-key service_account JSON', 'cloud policy must reject unsupported external-account credentials'],",
              1,
          )
          text = text.replace(
              "  ['client_email or service_account_impersonation_url', 'cloud policy must require an actual service-account identity'],",
              "  ['client_email and private_key', 'cloud policy must require complete private-key service-account material'],",
              1,
          )
          build_assert = "if (functionsAppPackageJson.scripts?.build !== 'next build') failures.push('mirrored Functions app build must be self-contained');"
          insert_after = "if (!String(packageJson.packageManager || '').endsWith('e3944156c4299921a89f976381ee107d41f12cfa4b66681ca9c718f0668fa0831ed4c6d8ba56c')) failures.push('packageManager must retain the full pnpm integrity hash');"
          if build_assert not in text:
              text = text.replace(insert_after, insert_after + '\n' + build_assert, 1)
          contract.write_text(text)

          functions_package = Path('functions/apps/urai-admin/package.json')
          data = json.loads(functions_package.read_text())
          data['scripts']['build'] = 'next build'
          functions_package.write_text(json.dumps(data, indent=2) + '\n')

          docs = Path('docs/PRODUCTION_TERMINAL_COMMANDS.md')
          text = docs.read_text()
          old = '`GOOGLE_APPLICATION_CREDENTIALS` pointing to a protected JSON credential whose service-account identity binds the target project; or'
          new = '`GOOGLE_APPLICATION_CREDENTIALS` pointing to protected complete private-key `service_account` JSON whose `client_email` binds the target project; or'
          if text.count(old) != 1:
              raise SystemExit('docs credential wording mismatch')
          docs.write_text(text.replace(old, new, 1))
          PY

      - name: Verify focused Admin repairs
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/system-registry-cloud-policy.mjs
          node --check scripts/test-system-registry-cloud-receipt.mjs
          node --check scripts/test-system-registry-seed-guard.mjs
          node --check scripts/test-system-registry-contract.mjs
          node scripts/test-system-registry-cloud-receipt.mjs
          node scripts/test-system-registry-seed-guard.mjs
          node scripts/test-system-registry-contract.mjs
          node -e "const p=require('./functions/apps/urai-admin/package.json'); if(p.scripts.build!=='next build') process.exit(1)"
          git diff --check

      - name: Commit permanent Admin files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LifeLoggerAI release automation'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/system-registry-cloud-policy.mjs scripts/test-system-registry-cloud-receipt.mjs scripts/test-system-registry-seed-guard.mjs scripts/test-system-registry-contract.mjs functions/apps/urai-admin/package.json docs/PRODUCTION_TERMINAL_COMMANDS.md
          git diff --cached --check
          git commit -m 'Align Admin credential and Functions build contracts'
          git push origin HEAD:fix/system-registry-truth-rebased-20260711
