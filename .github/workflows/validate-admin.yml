name: Validate URAI Admin

on:
  push:
    branches:
      - main
      - fix/admin-auth-api-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove install preserved exact clean head
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"

      - name: Typecheck admin app
        run: pnpm --filter urai-admin typecheck | tee /tmp/urai-admin-app-typecheck.log

      - name: Build admin app
        run: pnpm --filter urai-admin build | tee /tmp/urai-admin-app-build.log
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: dummy
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dummy.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: dummy-project
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: dummy.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: dummy
          NEXT_PUBLIC_FIREBASE_APP_ID: dummy

      - name: Upload validate evidence logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urai-admin-validate-evidence-${{ env.TARGET_SHA }}
          path: |
            /tmp/urai-admin-app-typecheck.log
            /tmp/urai-admin-app-build.log
          if-no-files-found: warn
          retention-days: 365
