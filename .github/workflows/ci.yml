name: URAI Admin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urai-admin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify URAI Admin
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Security gate
        run: pnpm security:gate

      - name: Verify active Functions entrypoint
        run: |
          pnpm functions:typecheck:active
          pnpm functions:build:active

      - name: Local release gate
        run: pnpm release:local

      - name: Verify production preflight script is callable without env
        run: |
          set +e
          pnpm preflight:production > /tmp/urai-admin-preflight.log 2>&1
          status=$?
          cat /tmp/urai-admin-preflight.log
          if [[ "$status" -eq 0 ]]; then
            echo "ERROR: production preflight unexpectedly passed in CI without production secrets" >&2
            exit 1
          fi
          grep -q "Missing required environment variable" /tmp/urai-admin-preflight.log

      - name: Upload CI evidence logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urai-admin-ci-evidence
          path: |
            /tmp/urai-admin-preflight.log
            docs/EVIDENCE_LOG.md
            docs/DEPLOYMENT_RUNBOOK.md
            docs/URAI_ADMIN_STANDALONE_READINESS.md
          if-no-files-found: warn
