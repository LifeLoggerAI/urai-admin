name: URAI Admin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify URAI Admin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Clean stale Functions sources
        run: bash scripts/clean-functions-legacy.sh

      - name: Clean generated app artifacts
        run: bash scripts/clean-app-generated.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Security gate
        run: pnpm security:gate

      - name: Verify active Functions entrypoint
        run: |
          pnpm functions:typecheck:active
          pnpm functions:build:active

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
