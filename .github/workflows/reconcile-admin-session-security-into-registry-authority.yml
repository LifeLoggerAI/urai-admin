name: Reconcile Admin session security into registry authority

on:
  push:
    branches:
      - reconcile/admin-session-security-into-45-20260714
    paths:
      - .github/workflows/reconcile-admin-session-security-into-registry-authority.yml
  pull_request:
    branches:
      - fix/system-registry-truth-rebased-20260711
    types:
      - opened
      - synchronize
    paths:
      - .github/workflows/reconcile-admin-session-security-into-registry-authority.yml

permissions:
  contents: write

concurrency:
  group: reconcile-admin-session-security-into-45
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.repository == 'LifeLoggerAI/urai-admin' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/reconcile/admin-session-security-into-45-20260714') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'reconcile/admin-session-security-into-45-20260714'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AUTHORITY_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      AUTHORITY_BRANCH: reconcile/admin-session-security-into-45-20260714
    steps:
      - name: Checkout exact reconciliation head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.AUTHORITY_SHA }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Verify authority and fetch retained session-security branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORITY_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch --no-tags origin \
            +refs/heads/security/p0-admin-session-coherence-20260706:refs/remotes/origin/security/p0-admin-session-coherence-20260706

      - name: Attempt source-only reconciliation
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/admin-reconciliation"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          git merge --no-commit --no-ff origin/security/p0-admin-session-coherence-20260706 \
            > "$RUNNER_TEMP/admin-reconciliation/merge.log" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/admin-reconciliation/merge-exit.txt"
          if [ "$status" -ne 0 ]; then
            git diff --name-only --diff-filter=U | sort > "$RUNNER_TEMP/admin-reconciliation/conflicts.txt"
            git merge --abort || true
            printf 'conflicted=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'conflicted=false\n' >> "$GITHUB_OUTPUT"

      - name: Upload conflict evidence
        if: steps.merge.outputs.conflicted == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: admin-session-security-reconciliation-${{ env.AUTHORITY_SHA }}
          path: ${{ runner.temp }}/admin-reconciliation
          retention-days: 90
          if-no-files-found: error

      - name: Fail closed on conflicts
        if: steps.merge.outputs.conflicted == 'true'
        shell: bash
        run: |
          echo 'Admin session-security conflicts require path-by-path security review. Evidence retained.'
          exit 1

      - name: Finalize clean reconciliation
        if: steps.merge.outputs.conflicted == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/reconcile-admin-session-security-into-registry-authority.yml
          mkdir -p docs/release-evidence
          cat > docs/release-evidence/ADMIN-SESSION-SECURITY-RECONCILIATION-20260714.md <<EOF
          # Admin session-security reconciliation

          - Canonical registry authority base: 65dc35efa6ef0f460273f0892214cb07e71c8ef0
          - Session-security source: 5b7fe1c5da4b8485c0aba1d636b64786b785f8c6
          - Trigger SHA: $AUTHORITY_SHA
          - Firebase deployment: false
          - Session/role mutation: false
          - Credential mutation: false
          - Production-data mutation: false

          The retained Admin authentication, origin, role, revocation and executable behavior-test source merged without conflicts into the canonical registry authority. Exact-head validation, artifact inspection and independent security review remain required before consumption into PR #45.
          EOF
          git add docs/release-evidence/ADMIN-SESSION-SECURITY-RECONCILIATION-20260714.md
          git diff --cached --check

      - name: Commit and publish clean reconciliation
        if: steps.merge.outputs.conflicted == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "Reconcile Admin session security into registry authority"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin HEAD:$AUTHORITY_BRANCH
